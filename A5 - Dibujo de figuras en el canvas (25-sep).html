<!DOCTYPE html>
<html>
<head>
    <title>A5 - Dibujo de figuras en el canvas (25-sep)</title>
    <style>
        body {
            background-color: rgb(98, 251, 208);
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-family: sans-serif;
        }

        canvas {
            background-color: rgb(224, 253, 246);
        }
    </style>
</head>
<body>
<h1>A5 - Dibujo de figuras en el canvas</h1>

<canvas id="myCanvas" width="1430" height="570" style="border:1px solid grey"></canvas>

<script>
const c = document.getElementById("myCanvas");
const ctx = c.getContext("2d");

// Primera figura
ctx.beginPath();
ctx.moveTo(11.17, 42.5);
ctx.lineTo(32.5, 42.5);
ctx.lineTo(32.5, 100.5);
ctx.lineTo(96.5, 100.5);
ctx.lineTo(96.5, 42.5);
ctx.lineTo(117.83, 42.5);
ctx.lineTo(64.5, 8.38);
ctx.lineTo(11.17, 42.5);
ctx.stroke();

// Segunda figura
ctx.beginPath();
ctx.moveTo(144.5, 41.5);
ctx.lineTo(150.5, 58.5);
ctx.lineTo(186.87, 58.52);
ctx.lineTo(177.5, 105.5);
ctx.lineTo(223.8, 105.5);
ctx.lineTo(214.5, 58.5);
ctx.lineTo(251.5, 58.5);
ctx.lineTo(257.5 , 41.5);
ctx.lineTo(212.5 , 17.5);
ctx.lineTo(189.5 , 17.5);
ctx.lineTo(144.5, 41.5);
ctx.stroke();

// --- ESTRELLA CON DEGRADADO DE AMARILLO A AMARILLO OSCURO ---
// 1. Crear el degradado lineal vertical ajustado a la altura de la estrella (Y: 20.5 a 101.5)
const starGradient = ctx.createLinearGradient(0, 20.5, 0, 101.5);
starGradient.addColorStop(0, "#FFFF00"); // Amarillo claro en la parte superior
starGradient.addColorStop(1, "#B88600"); // Amarillo oscuro (Dark Goldenrod) en la base

ctx.beginPath();
ctx.moveTo(278.3, 51.5);
ctx.lineTo(304.7, 70.6);
ctx.lineTo(294.6, 101.5);
ctx.lineTo(321 , 82.45);
ctx.lineTo(347.3, 101.5);
ctx.lineTo(337.2, 70.6 );
ctx.lineTo(363.6, 51.5);
ctx.lineTo(331.0 , 51.5);
ctx.lineTo(321 , 20.5);
ctx.lineTo(310.94 , 51.5);
ctx.closePath(); // Cierra la figura para un relleno perfecto

ctx.fillStyle = starGradient;
ctx.fill();   // Rellena la estrella con el degradado
ctx.stroke(); // Conserva el borde exterior

// Cuarta figura
ctx.beginPath();
ctx.moveTo(459.5, 22.5 );
ctx.lineTo(423.6, 22.0);
ctx.lineTo(396.5, 49.1);
ctx.lineTo(396.5 , 81.8);
ctx.lineTo(423.6, 108.9);
ctx.lineTo(459.5 , 108.5);
ctx.lineTo(459.5, 100.5);
ctx.lineTo(446.5  , 100.5);
ctx.lineTo(429.5 , 80.5);
ctx.lineTo(429.5 , 51.4);
ctx.lineTo(446.5, 31.5);
ctx.lineTo(459.5, 31.5);
ctx.lineTo(459.5, 22.5);
ctx.stroke();

// Quinta figura
ctx.beginPath();
ctx.moveTo(535.5, 20.5);
ctx.lineTo(521.5, 34.5);
ctx.lineTo(521.5, 62.5);
ctx.lineTo(490.5, 93.5);
ctx.lineTo(490.5, 122.4);
ctx.lineTo(523.5, 93.5);
ctx.lineTo(523.5, 122.5 );
ctx.lineTo(508.5, 147.5);
ctx.lineTo(514.2, 162.2);
ctx.lineTo(535.5, 141);
ctx.lineTo(556.7, 162.2);
ctx.lineTo(562.5, 147.5);
ctx.lineTo(547.5, 122.5);
ctx.lineTo(547.5, 93.5);
ctx.lineTo(580.5, 122.4);
ctx.lineTo(580.5, 93.5);
ctx.lineTo(549.5, 62.5);
ctx.lineTo(549.5, 34.5);
ctx.lineTo(535.5, 20.5);
ctx.stroke();
</script> 
</body>
</html>
