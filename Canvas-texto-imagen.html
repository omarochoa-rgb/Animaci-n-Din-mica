<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Texto e imagen en canvas</title>
    <style>
      body { 
        background-color:rgb(0, 0, 0);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      p{
        padding-left: 20px;
      }
      canvas {
        background-color:rgb(0, 0, 0);
    
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" width="800" height="800"></canvas>

    <script>
    window.onload = function () {
      var canvas = document.getElementById("canvas");
      var context = canvas.getContext("2d");
      var x = 350;
      var y = 200;
      context.font = '40pt Calibri';
      context.fillStyle = 'purple';
      context.fillText('Hello World!', x, y); //<== para poner texto en el canvas

      var imagen= new Image(); // variable para guardar la imagen
      imagen.src = "Full Shot.jpg"; // fuente de donde toma la imagen
      imagen.onload = function(){
        context.drawImage(imagen, 200, y ,960/2, 540/2); //<== para poner imagen en el canvas
      };
    };
    </script>
  </body>
</html>
