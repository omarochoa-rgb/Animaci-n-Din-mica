<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A3 - Animación con onda sinoidal/coseno</title>
    <style>
        body {
            background-color: #5387bc; /* Fondo del sitio web */
        }
  
    </style>
  </head>
  <body>
    <canvas id="canvas" width="1500" height="700"></canvas>
    
    <script src="utils.js"></script>
    <script src="./classes/ball.js"></script>
   <script>
window.onload = function () {
  var canvas = document.getElementById('canvas'),
      context = canvas.getContext('2d'),
      fishImage = new Image(),
      angle = 0,
      centerY = 200,
      range = 50,
      xspeed = 1,
      yspeed = 0.05,
      x = 0,
      y = 0;

  fishImage.src = "Fishy.png";

  (function drawFrame () {
    window.requestAnimationFrame(drawFrame, canvas);

    context.clearRect(0, 0, canvas.width, canvas.height);

    x += xspeed;
    y = centerY / 2 + Math.sin(angle) * range;
    angle += yspeed;

    // Render the PNG image directly to the canvas context
    context.drawImage(fishImage, x, y);
  }());
};
</script>
  </body>
</html>
